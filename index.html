<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Free and Simple | Videos Viral</title>
<style>
  :root {
    --bg-color: #0b0b0d;
    --card-bg: #16161a;
    --accent-pink: #ff0050;
    --accent-blue: #00f2fe;
    --text-primary: #ffffff;
    --text-secondary: #a1a1aa;
  }

  body {
    margin: 0;
    background: radial-gradient(circle at 50% 50%, #1a1a24 0%, var(--bg-color) 100%);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    padding-bottom: 40px;
  }

  /* Header Premium */
  .header {
    text-align: center;
    padding: 35px 20px 15px;
  }
  .header h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.5px;
    text-transform: uppercase;
  }
  .header h1 span {
    background: linear-gradient(45deg, var(--accent-pink), var(--accent-blue));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header p {
    margin: 8px 0 0;
    font-size: 13px;
    color: var(--text-secondary);
    letter-spacing: 0.5px;
  }

  /* Grid Responsif */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr); /* Default 2 kolom di HP */
    gap: 12px;
    padding: 16px;
    max-width: 1200px;
    margin: 0 auto;
  }

  @media (min-width: 640px) {
    .grid {
      grid-template-columns: repeat(3, 1fr); /* 3 kolom di tablet */
      gap: 16px;
    }
  }

  @media (min-width: 1024px) {
    .grid {
      grid-template-columns: repeat(4, 1fr); /* 4-5 kolom di desktop */
      gap: 20px;
    }
  }

  /* Kartu Video Premium */
  .card {
    position: relative;
    aspect-ratio: 9/16;
    border-radius: 16px;
    overflow: hidden;
    background: var(--card-bg);
    border: 1px solid rgba(255, 255, 255, 0.05);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), border-color 0.3s, box-shadow 0.3s;
    cursor: pointer;
  }

  .card:hover, .card:active {
    transform: translateY(-5px);
    border-color: rgba(255, 0, 80, 0.4);
    box-shadow: 0 12px 30px rgba(255, 0, 80, 0.25);
  }

  .card video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
    pointer-events: none;
    transition: filter 0.3s;
  }

  /* Username Overlay */
  .label {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 14px 10px;
    background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.5) 60%, transparent 100%);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.3px;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* Indikator Avatar Kecil di Samping Username */
  .label::before {
    content: '';
    display: inline-block;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: linear-gradient(45deg, var(--accent-pink), var(--accent-blue));
    flex-shrink: 0;
  }

  /* Tombol Play Overlay */
  .overlay-btn {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.25);
    opacity: 0;
    transition: opacity 0.25s, background-color 0.25s;
    z-index: 1;
  }

  .card:hover .overlay-btn {
    opacity: 1;
    background: rgba(0,0,0,0.4);
  }

  .overlay-btn span {
    background: linear-gradient(45deg, var(--accent-pink), #ff007b);
    color: #fff;
    padding: 8px 16px;
    border-radius: 50px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    box-shadow: 0 4px 15px rgba(255, 0, 80, 0.4);
    transform: scale(0.9);
    transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .card:hover .overlay-btn span {
    transform: scale(1);
  }

  /* Selalu munculkan tombol play di layar sentuh HP */
  @media (hover: none) and (pointer: coarse) {
    .overlay-btn {
      opacity: 1;
    }
  }

  /* Tombol Utama (Call To Action) di Bawah */
  .read-more-wrap {
    text-align: center;
    padding: 35px 20px;
  }

  .read-more {
    display: inline-block;
    background: linear-gradient(45deg, var(--accent-pink), #9600ff);
    color: white;
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
    padding: 14px 38px;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(255, 0, 80, 0.45);
    transition: all 0.3s ease;
    animation: pulseGlow 2s infinite;
  }

  .read-more:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 25px rgba(255, 0, 80, 0.65);
  }

  /* Efek Denyut Tombol */
  @keyframes pulseGlow {
    0% { box-shadow: 0 0 0 0 rgba(255, 0, 80, 0.7); }
    70% { box-shadow: 0 0 0 15px rgba(255, 0, 80, 0); }
    100% { box-shadow: 0 0 0 0 rgba(255, 0, 80, 0); }
  }

  /* Nonaktifkan seleksi teks agar rapi */
  * {
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    box-sizing: border-box;
  }
</style>
</head>

<script>
(() => {
  const g = document.getElementById("grid");
  const m = document.getElementById("more");

  const renderVideos = (items) => {
    items.forEach(t => {
      const card = document.createElement("div");
      card.className = "card";
      
      const isVidey = t.src.includes("cdn.videy.co");
      
      card.innerHTML = `
        <video src="${t.src}#t=0.1"
          muted
          playsinline
          preload="metadata"
        ></video>
        <div class="label">${t.user}</div>
        ${isVidey ? '<div class="overlay-btn"><span>▶ Tonton</span></div>' : ''}
      `;

      // Redirect saat di-klik
      card.onclick = () => {
        location.href = t.target;
      };

      // Efek Autoplay/Preview saat Hover di Laptop/Komputer
      card.onmouseenter = () => {
        const video = card.querySelector('video');
        if (video) video.play().catch(() => {});
      };
      
      card.onmouseleave = () => {
        const video = card.querySelector('video');
        if (video) {
          video.pause();
          video.currentTime = 0.1; // reset ke frame awal
        }
      };

      g.appendChild(card);
    });
  };

  // Render video utama saat pertama kali dimuat
  renderVideos(MAIN);

  // Fungsi klik tombol More
  m.onclick = (e) => {
    if (MORE && MORE.length > 0) {
      e.preventDefault();
      renderVideos(MORE);
      m.style.display = "none";
    }
  };
})();
</script>
